name: SEO skill checks

on:
  pull_request:
    paths:
      - 'SEO/seo-russia-audit-promotion/**'
      - '.github/workflows/seo-skill-tests.yml'
  push:
    branches: [main]
    paths:
      - 'SEO/seo-russia-audit-promotion/**'
      - '.github/workflows/seo-skill-tests.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill structure
        working-directory: SEO/seo-russia-audit-promotion
        run: python3 scripts/validate_skill.py
      - name: Run offline crawler tests
        working-directory: SEO/seo-russia-audit-promotion
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
